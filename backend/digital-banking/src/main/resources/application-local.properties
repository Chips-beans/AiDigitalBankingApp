# Opt-in local development only. Run with SPRING_PROFILES_ACTIVE=local.
# Inherit Gmail SMTP/STARTTLS defaults from application.properties.
app.dev.seed.enabled=${DEV_SEED_ENABLED:true}
app.dev.seed.password=${DEV_SEED_PASSWORD}

# Separate Gmail-reachable staff fixture. Disabled unless explicitly configured.
app.dev.qa-staff.enabled=${QA_STAFF_ENABLED:false}
app.dev.qa-staff.username=${QA_STAFF_USERNAME:}
app.dev.qa-staff.email=${QA_STAFF_EMAIL:}
app.dev.qa-staff.password=${QA_STAFF_PASSWORD:}
