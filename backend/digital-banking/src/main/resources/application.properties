# ===================================================================
# Application Core Settings
# ===================================================================
spring.application.name=digital-banking
server.port=${SERVER_PORT:8080}

# Active Spring Profile (e.g., dev, prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Explicit non-production test credits for newly opened USD/KHR pairs. Never enable in production.
app.dev.opening-funding.enabled=${TEST_OPENING_FUNDING_ENABLED:false}
# Fixed internal rate for USD/KHR transfers; KHR->USD credits round down to whole cents.
app.fx.khr-per-usd=${FX_KHR_PER_USD:4000}
# Customer transfers need a one-time proof from POST /auth/pin/transfer-proof (X-Pin-Proof header).
app.transfer.pin-proof-required=${TRANSFER_PIN_PROOF_REQUIRED:true}
app.recipient-lookup.max-per-window=${RECIPIENT_LOOKUP_MAX:120}
app.recipient-lookup.window-minutes=${RECIPIENT_LOOKUP_WINDOW_MINUTES:15}

# ===================================================================
# PostgreSQL Database Configuration
# ===================================================================
# Dynamically loaded from .env variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digital_banking_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pooling Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# Bound financial account/idempotency and audit lock waits; local to each transaction.
app.financial.lock-timeout-ms=${FINANCIAL_LOCK_TIMEOUT_MS:5000}

# ===================================================================
# Spring Data JPA & Hibernate Configuration
# ===================================================================
# 'validate' checks entity mappings against the database schema managed by Flyway
spring.jpa.hibernate.ddl-auto=validate

# PostgreSQL Dialect for Hibernate 6 / Spring Boot 3+
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL Execution Logging (set to false in production via .env)
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# ===================================================================
# Flyway Database Migration Configuration
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ===================================================================
# Security & JWT Configuration
# ===================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===================================================================
# File Upload Configuration
# ===================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===================================================================
# Gmail OTP Configuration
# ===================================================================
# Gmail SMTP Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:wallet@example.test}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}

# OTP email transport: smtp (default) or gmail-api (HTTPS; for hosts that block outbound SMTP, e.g. Railway).
app.mail.provider=${MAIL_PROVIDER:smtp}
# Gmail API (only read when MAIL_PROVIDER=gmail-api): OAuth client + refresh token with scope gmail.send.
app.mail.gmail.client-id=${GMAIL_CLIENT_ID:}
app.mail.gmail.client-secret=${GMAIL_CLIENT_SECRET:}
app.mail.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:}
# Optional From address; must be the authorized account (or its alias). Blank lets Gmail use the account address.
app.mail.gmail.sender=${GMAIL_SENDER:}

# Custom OTP Properties
app.otp.expiration-minutes=5

logging.level.org.springframework.security=INFO



# ===================================================================
# Native QR Payment Configuration
# ===================================================================
app.qr.merchant-name=${APP_QR_MERCHANT_NAME:Digital Bank}
app.qr.merchant-city=${APP_QR_MERCHANT_CITY:Phnom Penh}
app.qr.acquiring-bank=${APP_QR_ACQUIRING_BANK:Digital Bank}
app.qr.country-code=${APP_QR_COUNTRY_CODE:KH}
app.qr.guid=${APP_QR_GUID:bank@digitalbank}
spring.jpa.open-in-view=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.localhost=${MAIL_CLIENT_HOSTNAME:localhost}
spring.mail.properties.mail.host=${MAIL_CLIENT_HOSTNAME:localhost}
spring.mail.properties.mail.from=${MAIL_USERNAME:wallet@example.test}
app.otp.resend-seconds=${OTP_RESEND_SECONDS:60}
app.otp.max-requests=${OTP_MAX_REQUESTS:5}
app.otp.window-minutes=${OTP_WINDOW_MINUTES:15}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.login.max-attempts=${LOGIN_MAX_ATTEMPTS:10}
app.login.window-minutes=${LOGIN_WINDOW_MINUTES:15}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081}


# ====================================
# Swagger UI
# ====================================

springdoc.packages-to-scan=com.bank.digital_banking.module

# ============================
# AI gateway (OpenAI-compatible)
# ============================
# App AI gateway properties
app.ai.gateway.api-url=${AI_API_URL:https://api.groq.com/openai/v1}
app.ai.gateway.api-key=${AI_API_KEY:}
app.ai.gateway.model=${AI_MODEL:qwen/qwen3.8-27b}
app.ai.gateway.json-mode=${AI_JSON_MODE:schema}
app.ai.gateway.reasoning-effort=${AI_REASONING_EFFORT:none}
app.ai.gateway.enabled=${AI_ENABLED:false}
app.ai.gateway.customer-context-enabled=${AI_CUSTOMER_CONTEXT_ENABLED:false}
# The old GEMINI_* names are deliberately not read: a Gemini key is not valid for this gateway. AIConfigCheck warns at startup when they remain.

# Telegram OIDC credentials remain on the server. Blank settings disable Telegram continuation.
app.telegram.client-id=${TELEGRAM_CLIENT_ID:}
app.telegram.client-secret=${TELEGRAM_CLIENT_SECRET:}
app.telegram.redirect-uri=${TELEGRAM_REDIRECT_URI:}
app.telegram.frontend-origin=${TELEGRAM_FRONTEND_ORIGIN:http://localhost:8081}
app.telegram.native-redirect-uri=${TELEGRAM_NATIVE_REDIRECT_URI:}
