# ===================================================================
# Application Core Settings
# ===================================================================
spring.application.name=digital-banking
server.port=${SERVER_PORT:8080}

# Active Spring Profile (e.g., dev, prod)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===================================================================
# PostgreSQL Database Configuration
# ===================================================================
# Dynamically loaded from .env variables
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digital_banking_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pooling Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# ===================================================================
# Spring Data JPA & Hibernate Configuration
# ===================================================================
# 'validate' checks entity mappings against the database schema managed by Flyway
spring.jpa.hibernate.ddl-auto=update

# PostgreSQL Dialect for Hibernate 6 / Spring Boot 3+
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# SQL Execution Logging (set to false in production via .env)
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}

# ===================================================================
# Flyway Database Migration Configuration
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ===================================================================
# Security & JWT Configuration
# ===================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ===================================================================
# File Upload Configuration
# ===================================================================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ===================================================================
# Gmail OTP Configuration
# ===================================================================
# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Custom OTP Properties
app.otp.expiration-minutes=5



logging.level.org.springframework.security=TRACE