server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /downloads/kesor-bank.apk {
        alias /apk-downloads/kesor-bank.apk;
        gzip_static always;
        gunzip on;
        gzip_vary on;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Kesor Bank.apk"';
        add_header Cache-Control "no-cache";
    }

    location = /downloads/kesor-merchant.apk {
        alias /apk-downloads/kesor-merchant.apk;
        gzip_static always;
        gunzip on;
        gzip_vary on;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="KesorMerchant.apk"';
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
