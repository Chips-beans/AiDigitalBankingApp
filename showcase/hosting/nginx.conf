server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The APKs are baked into the image under downloads/ (arm64-v8a debug builds), so
    # no volume is needed. Raw files: Content-Length and resumable range requests work.
    location = /downloads/kesor-bank.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Kesor Bank.apk"';
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /downloads/kesor-merchant.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="KesorMerchant.apk"';
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /downloads/manifest.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
