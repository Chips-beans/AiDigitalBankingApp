name: merchant_app
description: Kesor Merchant Android app for shop owners and payment collection.
publish_to: none
version: 0.1.0+1
environment:
  sdk: ^3.13.4
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  crypto: ^3.0.7
  file_selector: ^1.1.0
  kesor_design_system:
    path: ../packages/kesor_design_system
  kesor_auth_handoff:
    path: ../packages/kesor_auth_handoff
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/GoogleSans-OFL.txt
    - assets/fonts/NotoSansKhmer-OFL.txt
    - assets/fonts/Poppins-OFL.txt
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Noto Sans Khmer
      fonts:
        - asset: assets/fonts/NotoSansKhmer-Variable.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKhmer-Variable.ttf
          weight: 500
        - asset: assets/fonts/NotoSansKhmer-Variable.ttf
          weight: 700

